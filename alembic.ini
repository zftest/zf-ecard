# Alembic configuration.
#
# NOTE: keep this file pure ASCII. Alembic reads it with encoding="locale",
# which is GBK on Chinese Windows; any UTF-8 CJK comment here raises
# UnicodeDecodeError before migrations even start.
#
# sqlalchemy.url is intentionally left empty: the real path comes from
# migrations/env.py -> core.db.resolve_db_path()
# (explicit arg > ECARD_DB_PATH > data/app.db), so no path is committed to Git.
[alembic]
script_location = migrations
prepend_sys_path = .
# Alembic 1.16+ requires an explicit sys.path separator, otherwise every
# command emits a DeprecationWarning.
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
