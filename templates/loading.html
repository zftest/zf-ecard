<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成中...</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        .loading-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .spinner {
            width: 60px; height: 60px;
            border: 6px solid #e0e0e0;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 20px; color: #555; }
        .loading-sub  { font-size: 14px; color: #999; margin-top: 8px; }
    </style>
</head>
<body>
<div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">🤖 AI 正在生成知识卡片...</div>
    <div class="loading-sub">通常需要 15~30 秒，请稍候</div>
</div>
</body>
</html>
